<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubra Corp Idle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Kubra Corp Idle!</h1>
        <p>It's resource gathering time, baby</p>
        <nav>
            <ul>
                <li><a href="#mainCharacter">Main</a></li>
                <li><a href="#resources">Resources</a></li>
                <li><a href="#skills">Skills</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="mainCharacter">
            <h2>Current Status</h2>
            <p>Gold: <span id="gold">0</span></p>
            <p>Gathering: <span id="resource">Nothing</span></p>
            <button type="button">Generate</button>
        </section>

        <section id="resources">

            <h2>Resources</h2>
            
            <div class="resourcegrid">
                <article>
                    <h3>Wood</h3>
                    <p>0</p>
                </article>

                <article>
                    <h3>Copper</h3>
                    <p>0</p>
                </article>

                <article>
                    <h3>Fish</h3>
                    <p>0</p>
                </article>
            </div>
        </section>

        <section id="skills">
            <h2>Skills</h2>
            <p>Watch your skills improve, wow</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kubra Corp Idle</p>
    </footer>
</body>
</html>
